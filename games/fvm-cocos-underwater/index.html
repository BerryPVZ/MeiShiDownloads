<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Cocos Creator | MSH5</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  
  <!-- force screen orientation on some browser -->
  <meta name="screen-orientation" content="landscape"/>
  <meta name="x5-orientation" content="landscape">

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style-mobile.540ab.css"/>

<style>
/* FvM Hub mobile/embed compatibility patch */
html, body {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  margin: 0 !important;
  padding: 0 !important;
  overflow: hidden !important;
  background: #000 !important;
  overscroll-behavior: none;
  touch-action: none;
}
body { position: fixed !important; inset: 0 !important; display: block !important; }
#GameDiv, #Cocos2dGameContainer {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  max-height: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  overflow: hidden !important;
  background: #000 !important;
}
#GameCanvas, canvas {
  display: block !important;
  margin: 0 !important;
  padding: 0 !important;
  touch-action: none !important;
  -webkit-user-select: none !important;
  user-select: none !important;
}
#splash { z-index: 9999; }
.progress-bar { max-width: calc(100vw - 48px); }
@media (orientation: portrait) {
  #GameDiv, #Cocos2dGameContainer { width: 100% !important; height: 100% !important; }
}
</style>
<script>window.__FVM_IN_IFRAME__ = (window.self !== window.top);</script>
</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>
<script src="src/settings.fa4e7.js" charset="utf-8"></script>

<script src="main.44e6f.js" charset="utf-8"></script>

<script type="text/javascript">
(function () {
    // open web debugger console
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    var cocos2d = document.createElement('script');
    cocos2d.async = true;
    cocos2d.src = window._CCSettings.debug ? 'cocos2d-js.js' : 'cocos2d-js-min.97f15.js';

    var engineLoaded = function () {
        document.body.removeChild(cocos2d);
        cocos2d.removeEventListener('load', engineLoaded, false);
        window.boot();
    };
    cocos2d.addEventListener('load', engineLoaded, false);
    document.body.appendChild(cocos2d);
})();
</script>

<script>
(function () {
  function fitCocos() {
    try {
      if (window.cc && cc.view) {
        cc.view.resizeWithBrowserSize(true);
        if (cc.view.setFrameSize) cc.view.setFrameSize(window.innerWidth, window.innerHeight);
      }
    } catch (_) {}
  }
  window.addEventListener('resize', fitCocos, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(fitCocos, 120); }, { passive: true });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCocos, { passive: true });
  setTimeout(fitCocos, 250);
  setTimeout(fitCocos, 1000);
})();
</script>

</body>
</html>
